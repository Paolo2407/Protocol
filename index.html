<script>
/* Uso offline: il service worker si registra solo sulla versione pubblicata su GitHub Pages
   (o in locale), non dentro l'anteprima di Claude. */
if ('serviceWorker' in navigator && (location.hostname.endsWith('github.io') || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
